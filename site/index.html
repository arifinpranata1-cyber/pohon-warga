<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pohon Warga</title>
<style>
@font-face{font-family:Poppins;font-weight:400;font-display:swap;src:url(fonts/Poppins-Regular.ttf) format('truetype')}
@font-face{font-family:Poppins;font-weight:500;font-display:swap;src:url(fonts/Poppins-Medium.ttf) format('truetype')}
@font-face{font-family:Poppins;font-weight:600 800;font-display:swap;src:url(fonts/Poppins-Bold.ttf) format('truetype')}
html,body{margin:0;height:100%;background:#7fc4ea;overflow:hidden;font-family:Poppins,'Helvetica Neue',Arial,sans-serif;-webkit-user-select:none;user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;color:#fff;pointer-events:none}
#top{left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-start}
.logo{font-weight:700;font-size:22px;text-shadow:0 2px 10px #1a146688}
.chip{display:inline-block;background:#FFC227;color:#1A1466;font-weight:700;font-size:13px;padding:6px 14px;border-radius:20px;box-shadow:0 4px 12px #0003;margin-left:6px}
.chip.w{background:#ffffffee}
#side{right:16px;top:58px;width:min(260px,70vw);pointer-events:auto}
#q{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:20px;border:0;font:500 13px Poppins,sans-serif;background:#ffffffee;color:#1A1466;outline:none;box-shadow:0 4px 14px #0003}
#res{margin-top:6px}
#res div{background:#fffffff2;color:#1A1466;border-radius:14px;padding:8px 14px;margin-top:4px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px #0002}
#res div small{color:#5B2AA8;font-weight:500}
#bar{left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px;pointer-events:auto;flex-wrap:wrap;padding:0 12px}
.btn{background:#ffffffee;color:#1A1466;font:700 13px Poppins,sans-serif;padding:10px 16px;border-radius:22px;border:0;cursor:pointer;box-shadow:0 4px 12px #0003}
.btn.on{background:#1A1466;color:#fff}
#info{left:16px;bottom:70px;max-width:min(320px,70vw);background:#FFF3C4;color:#1A1466;border-radius:18px;padding:12px 16px;font-size:12.5px;line-height:1.45;box-shadow:0 8px 24px #0004;pointer-events:none}
#info b{font-size:13.5px}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#ffffffee;color:#1A1466;font:700 10.5px Poppins,sans-serif;padding:2px 8px;border-radius:9px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px #0003;will-change:transform}
.lbl.u{background:#7a4ad8;color:#fff}.lbl.k{background:#FFC227}.lbl.h{background:#2f9e55;color:#fff}.lbl.sel{outline:2px solid #fff;font-size:12px}
#shot{position:absolute;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;border:4px solid #fff;background:#ffffff55;display:none;pointer-events:auto;cursor:pointer}
body.photo .hud:not(#bar){display:none}body.photo .lbl{display:none}body.photo #bar .nf{display:none}body.photo #shot{display:block}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#7fc4ea;color:#1A1466;font-weight:700;font-size:16px;transition:opacity .5s}
</style></head><body>
<canvas id="c"></canvas>
<div id="lbls"></div>
<div class="hud" id="top"><div class="logo">🌳 POHON WARGA</div><div><span class="chip w" id="pop">… warga</span><span class="chip" id="day">HARI KE-…</span></div></div>
<div class="hud" id="side"><input id="q" placeholder="Cari rumah warga (tanpa @)" autocomplete="off"><div id="res"></div></div>
<div class="hud" id="info" style="display:none"></div>
<div class="hud" id="bar"><button class="btn nf" data-m="siang">☀️ Siang</button><button class="btn nf" data-m="sore">🌇 Sore</button><button class="btn nf" data-m="malam">🌙 Malam</button><button class="btn" id="photo">📷 Mode foto</button></div>
<div id="shot" title="Ambil foto"></div>
<div id="load">Memuat desa…</div>
<script type="importmap">{"imports":{"three":"./lib/three/build/three.module.js","three/addons/":"./lib/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const Q=new URLSearchParams(location.search);
const hr=(new Date().getUTCHours()+7)%24;
let MODE=Q.get('m')||(Q.has('night')?'malam':((hr>=6&&hr<16)?'siang':(hr>=16&&hr<19)?'sore':'malam'));
if(MODE==='senja')MODE='sore';

const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFShadowMap;
R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,1,1,900);
const controls=new OrbitControls(cam,cv);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI*.47;controls.minDistance=18;controls.maxDistance=330;controls.screenSpacePanning=false;
const HOME={t:new THREE.Vector3(0,0,0),p:new THREE.Vector3(222,246,217).normalize().multiplyScalar(255)};
if(innerWidth/innerHeight<.8)HOME.p.multiplyScalar(1.5);cam.position.copy(HOME.p);controls.target.copy(HOME.t);controls.update();
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<.8?42:30;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// ---------- pencahayaan (3 suasana) ----------
const LOOK={
 siang:{sky:['#6fb8ee','#bfe0f6','#fff0cf'],fog:0xcfe6f2,hemi:[0xfff4e0,0x8ccf9a,1.4],sun:[0xfff0d0,3.0],pos:[-45,78,32],exp:1.05,lamp:0},
 sore:{sky:['#5a4cc0','#e59ab8','#ffcf94'],fog:0xe9b0bd,hemi:[0xffd6c0,0x7a8fd0,.95],sun:[0xffb878,3.4],pos:[70,48,-20],exp:1.12,lamp:.45},
 malam:{sky:['#03021f','#0c0c4a','#2b1a66'],fog:0x0b0a2e,hemi:[0x6a6aef,0x244a66,.55],sun:[0x8a9cf0,.5],pos:[-40,70,30],exp:.95,lamp:1}
};
const hemi=new THREE.HemisphereLight(0xffffff,0x888888,1);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-95,right:95,top:95,bottom:-95,near:1,far:400});sun.shadow.bias=-.0004;sun.shadow.normalBias=.05;S.add(sun);S.add(sun.target);
const LAMPS=[[17.5,4.7],[-4.7,17.5],[-17.5,-4.7],[4.7,-17.5],[22.2,17],[-28.4,3.7],[3.6,-27.7],[29.3,-3.9]];
const lampLights=LAMPS.map(([x,y])=>{const l=new THREE.PointLight(0xffc878,0,26,1.6);l.position.set(x,3.4,-y);S.add(l);return l});
let glowMats=[];
function skyTex(c){const k=document.createElement('canvas');k.width=4;k.height=512;const g=k.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,c[0]);gr.addColorStop(.55,c[1]);gr.addColorStop(1,c[2]);g.fillStyle=gr;g.fillRect(0,0,4,512);const t=new THREE.CanvasTexture(k);t.colorSpace=THREE.SRGBColorSpace;return t}
function setMode(m){
 if(!LOOK[m])m='siang';MODE=m;const L=LOOK[m];
 S.background=skyTex(L.sky);S.fog=new THREE.Fog(L.fog,230,520);
 hemi.color.set(L.hemi[0]);hemi.groundColor.set(L.hemi[1]);hemi.intensity=L.hemi[2];
 sun.color.set(L.sun[0]);sun.intensity=L.sun[1];sun.position.set(...L.pos);R.toneMappingExposure=L.exp;
 lampLights.forEach(l=>l.intensity=L.lamp*38);
 glowMats.forEach(g=>{g.emissive=new THREE.Color(0xffc060);g.emissiveIntensity=L.lamp*2.2});
 document.body.style.background=L.sky[1];
 document.querySelectorAll('#bar [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
}

// ---------- muat aset ----------
const GL=new GLTFLoader();
const [stat,rumah,slots,DATA]=await Promise.all([
 GL.loadAsync('v5/pw_desa_static.glb'),GL.loadAsync('v5/pw_rumah.glb'),
 fetch('v5/pw_slots.json').then(r=>r.json()),fetch('data/world.json').then(r=>r.json())
]);
let LBL={};try{LBL=await (await fetch('v5/labels.json')).json()}catch(e){}
let DAYS=[];try{DAYS=await (await fetch('data/days.json')).json()}catch(e){}

function prep(o,recv){o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=!!recv;const mt=m.material;if(mt&&mt.name==='v5_lamp_glow')glowMats.push(mt);if(mt&&/^v5_(shallow|deep|foam)$/.test(mt.name)){m.castShadow=false}}})}
const desa=stat.scene;prep(desa,true);S.add(desa);
{const rm=[];desa.traverse(o=>{if(o.isMesh&&o.material&&o.material.name==='v5_lamp_glow')glowMats.push(o.material)})}
glowMats=[...new Set(glowMats)];

// ---------- rumah warga ----------
const SECT={ungu:{roof:0x6a3dc0,cls:'u'},kuning:{roof:0xe6a31a,cls:'k'},hijau:{roof:0x33a352,cls:'h'}};
const roofMat={};
function houseFor(sector){
 const h=rumah.scene.clone(true);
 h.traverse(m=>{if(!m.isMesh)return;m.castShadow=true;m.receiveShadow=true;
  if(m.material&&m.material.name==='v5_roof_odds'){roofMat[sector]=roofMat[sector]||Object.assign(m.material.clone(),{color:new THREE.Color(SECT[sector].roof)});m.material=roofMat[sector]}});
 return h;
}
const ODDS=slots.reduce((b,s)=>Math.hypot(s.x-20.86,s.z+14.22)<Math.hypot(b.x-20.86,b.z+14.22)?s:b,slots[0]);
const builds=(DATA.buildings||[]).filter(b=>b.type!=='balai'&&(b.status==='done'||b.status==='building'));
const order=slots.filter(s=>s!==ODDS);
const placed=[];let oi=0;
for(const b of builds){
 const s=(b.id==='b1')?ODDS:order[oi++];if(!s)break;
 const h=houseFor(s.sector);h.position.set(s.x,0,s.z);h.rotation.y=s.ry;
 if(b.status==='building'){h.scale.setScalar(.75);h.traverse(m=>{if(m.isMesh){m.material=m.material.clone();m.material.transparent=true;m.material.opacity=.6}})}
 S.add(h);
 const user=LBL[b.id]||(b.by&&DATA.residents&&DATA.residents[b.by]?DATA.residents[b.by].username.replace(/^@/,''):null);
 placed.push({b,s,h,user:user||('rumah '+b.id),cls:SECT[s.sector].cls});
}

// ---------- label HTML ----------
const lbBox=document.getElementById('lbls');
placed.forEach(p=>{const d=document.createElement('div');d.className='lbl '+p.cls;d.textContent='@'+p.user;lbBox.appendChild(d);p.el=d;p.pos=new THREE.Vector3(p.s.x,6.4,p.s.z)});
const tmp=new THREE.Vector3();let SEL=null;
function updLabels(){
 const dist=cam.position.distanceTo(controls.target),many=placed.length>12;
 for(const p of placed){tmp.copy(p.pos).project(cam);const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1&&(!many||dist<130||p===SEL);
  p.el.style.display=vis?'block':'none';if(vis){p.el.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`}}
}
// ---------- pencarian + terbang ke rumah ----------
let fly=null;
function flyTo(p){SEL=p;placed.forEach(x=>x.el.classList.toggle('sel',x===p));
 const t=new THREE.Vector3(p.s.x,3,p.s.z),dir=new THREE.Vector3(p.s.x,0,p.s.z).normalize();
 const side=new THREE.Vector3(-dir.z,0,dir.x),to=t.clone().sub(dir.clone().multiplyScalar(13)).add(side.multiplyScalar(20)).add(new THREE.Vector3(0,16,0));
 fly={t0:performance.now(),a:controls.target.clone(),b:t,pa:cam.position.clone(),pb:to};
 const i=document.getElementById('info');i.style.display='block';i.innerHTML=`<b>@${p.user}</b><br>Rumah ${p.b.id} · Sektor ${p.s.sector} · Hari ke-${p.b.day}`}
const qi=document.getElementById('q'),rs=document.getElementById('res');
qi.addEventListener('input',()=>{const v=qi.value.trim().replace(/^@/,'').toLowerCase();rs.innerHTML='';if(!v)return;
 placed.filter(p=>p.user.toLowerCase().includes(v)).slice(0,5).forEach(p=>{const d=document.createElement('div');d.innerHTML=`@${p.user} <small>· sektor ${p.s.sector}</small>`;d.onclick=()=>{flyTo(p);rs.innerHTML='';qi.blur()};rs.appendChild(d)});
 if(!rs.children.length){const d=document.createElement('div');d.textContent='Belum ketemu. Follow @pohonwarga lalu komen untuk dapat rumah!';rs.appendChild(d)}});
function goHome(){SEL=null;placed.forEach(x=>x.el.classList.remove('sel'));document.getElementById('info').style.display='none';fly={t0:performance.now(),a:controls.target.clone(),b:HOME.t.clone(),pa:cam.position.clone(),pb:HOME.p.clone()}}
addEventListener('keydown',e=>{if(e.key==='Escape')goHome()});

// ---------- HUD ----------
const L2=DAYS[DAYS.length-1];
document.getElementById('day').textContent='HARI KE-'+(DATA.day??0);
document.getElementById('pop').textContent=(DATA.population??placed.length)+' warga';
document.querySelectorAll('#bar [data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
const photoBtn=document.getElementById('photo');
photoBtn.onclick=()=>{document.body.classList.toggle('photo');photoBtn.textContent=document.body.classList.contains('photo')?'✕ Keluar foto':'📷 Mode foto';controls.autoRotate=false};
document.getElementById('shot').onclick=()=>{R.render(S,cam);cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pohon-warga-'+MODE+'.png';a.click()})};
setMode(MODE);

// ---------- API untuk script video / tes ----------
window.__tt=undefined;window.__ready=true;
window.__cam=c=>{if(c&&c.pos)cam.position.set(...c.pos);if(c&&c.target)controls.target.set(...c.target);controls.update()};
window.__houses=placed.map(p=>({id:p.b.id,user:p.user,sector:p.s.sector,x:p.s.x,z:p.s.z}));

document.getElementById('load').style.opacity=0;setTimeout(()=>document.getElementById('load').remove(),600);
function loop(){requestAnimationFrame(loop);
 if(fly){const k=Math.min(1,(performance.now()-fly.t0)/1100),e=k*k*(3-2*k);controls.target.lerpVectors(fly.a,fly.b,e);cam.position.lerpVectors(fly.pa,fly.pb,e);if(k>=1)fly=null}
 controls.update();R.render(S,cam);updLabels()}
loop();
</script></body></html>
