name: Hari baru Pohon Warga
on:
  schedule:
    - cron: '5 12 * * *'   # 19:05 WIB (GitHub bisa terlambat beberapa menit)
  workflow_dispatch: {}     # tombol jalankan manual
permissions:
  contents: write
concurrency: pohon-warga-daily
jobs:
  day:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Jalankan satu hari
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/daily.js
      - name: Simpan hasil
        run: |
          git config user.name "pohon-warga-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data manual
          git diff --cached --quiet || (git commit -m "Hari baru" && git push)
